name: Backend Tests

on:
  push:
    branches:
      - main
      - "day-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Maven test suite (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: vericode-backend/pom.xml

      - name: Run backend tests
        working-directory: vericode-backend
        run: bash ./mvnw -B -ntp test
