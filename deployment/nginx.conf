worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json text/plain image/svg+xml;

    # VeriCode keeps authentication in HttpSession, so use client-IP affinity
    # until sessions are moved to a shared store such as Redis.
    upstream vericode_backend {
        ip_hash;
        server backend-1:8080;
        server backend-2:8080;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://vericode_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Hashed Vite assets are immutable and can be cached for a year.
        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # HTML is deliberately not long-lived so deployments can switch chunks safely.
        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
