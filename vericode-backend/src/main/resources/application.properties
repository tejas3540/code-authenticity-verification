spring.application.name=vericode-backend

# HTTP response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate fetch batching reduces N+1 round trips for lazy associations
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Server-side cache (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=questions,questionById,questionImports
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
